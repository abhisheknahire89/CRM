<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1088" width="100%" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Production architecture of the Deal Evidence Ledger</title>
<desc id="d">Nine layers from read-only data sources through connectors, normalisation, AI evidence extraction, evidence store, deterministic policy engine, application API, ledger UI, to human decisions and the audit log. AI interprets, policy computes, people decide.</desc>
